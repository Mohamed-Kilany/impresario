# XcodeGen spec for the Impresario Apple agent (spec TASK.md section 12).
#
#   brew install xcodegen
#   cd agents/apple && xcodegen generate          # writes ImpresarioApple.xcodeproj
#
# The generated project is *not* committed (docs/DECISIONS.md I-89): it cannot be
# produced or opened on Windows, so the spec is the source of truth and the
# `.xcodeproj` is rebuilt on the macOS host that runs the devices.
#
# Targets
#   AgentHost-iOS / -tvOS     empty host apps; the UI-test bundles use them as
#                             their target application (XCTest needs one to open
#                             an automation session). The app under test is *not*
#                             a build target — the master names it via `app_id`
#                             and the runner launches it with XCUIApplication.
#   AgentUITests-iOS / -tvOS  the runner: AgentRunnerTests/testServe starts the
#                             gRPC agent with the XCUIDriver and serves until
#                             `Shutdown` (AppleTransport -only-testing bundle
#                             ids below must not change).
#   AgentTargetStub-iOS/-tvOS the fixture app under test (same accessibility ids
#                             as agents/android/agent-target-stub).
#
# Usage on the host (see README.md):
#   xcodebuild build-for-testing -scheme AgentUITests-iOS \
#     -destination 'platform=iOS,id=<udid>' -derivedDataPath build
#   xcodebuild test-without-building -xctestrun build/Build/Products/*.xctestrun ...
name: ImpresarioApple

options:
  bundleIdPrefix: com.impresario.agent
  deploymentTarget:
    iOS: "16.0"
    tvOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.38.0"
  # Development signing: set DEVELOPMENT_TEAM in Xcode (Signing & Capabilities)
  # or add a Local.xcconfig; device runs need a team, simulator runs do not.

settings:
  base:
    # The runner drives XCUITest from a non-main serial queue (XCUIDriver) and
    # the package is Swift 5.10; Swift 6 language mode would demand main-actor
    # isolation for every XCUIAutomation call. See docs/DECISIONS.md I-88.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TVOS_DEPLOYMENT_TARGET: "16.0"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  ImpresarioAgent:
    path: .

targets:
  # ------------------------------------------------------------------
  # Empty host apps (the UI-test bundles' target application)
  # ------------------------------------------------------------------
  AgentHost-iOS:
    type: application
    platform: iOS
    sources:
      - path: Xcode/AgentHost
        excludes: ["Info-*.plist"]
    info:
      path: Xcode/AgentHost/Info-iOS.plist
      properties:
        CFBundleDisplayName: Impresario Agent Host
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        # The runner process binds the agent port; the host app shows the
        # permission prompt when XCTest launches it first (I-88).
        NSLocalNetworkUsageDescription: >-
          Impresario runs automated UI tests over your local network. The test
          runner must be reachable by the build machine to receive commands.
        NSBonjourServices:
          - _impresario._tcp

  AgentHost-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Xcode/AgentHost
        excludes: ["Info-*.plist"]
    info:
      path: Xcode/AgentHost/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Impresario Agent Host
        NSLocalNetworkUsageDescription: >-
          Impresario runs automated UI tests over your local network. The test
          runner must be reachable by the build machine to receive commands.
        NSBonjourServices:
          - _impresario._tcp

  # ------------------------------------------------------------------
  # The runner (UI-test bundles)
  # ------------------------------------------------------------------
  AgentUITests-iOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Xcode/AgentUITests
        excludes: ["Info-*.plist"]
    dependencies:
      - target: AgentHost-iOS
      - package: ImpresarioAgent
        product: AgentCore
      - package: ImpresarioAgent
        product: AgentService
    info:
      path: Xcode/AgentUITests/Info-iOS.plist
      properties:
        # Required: without the usage description the runner is terminated the
        # first time it serves the local network (iOS 14+).
        NSLocalNetworkUsageDescription: >-
          Impresario runs automated UI tests over your local network. The test
          runner must be reachable by the build machine to receive commands.
        NSBonjourServices:
          - _impresario._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impresario.agent.AgentUITests-iOS
        TEST_TARGET_NAME: AgentHost-iOS
        SWIFT_OBJC_BRIDGING_HEADER: Xcode/AgentUITests/AgentUITests-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO

  AgentUITests-tvOS:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: Xcode/AgentUITests
        excludes: ["Info-*.plist"]
    dependencies:
      - target: AgentHost-tvOS
      - package: ImpresarioAgent
        product: AgentCore
      - package: ImpresarioAgent
        product: AgentService
    info:
      path: Xcode/AgentUITests/Info-tvOS.plist
      properties:
        NSLocalNetworkUsageDescription: >-
          Impresario runs automated UI tests over your local network. The test
          runner must be reachable by the build machine to receive commands.
        NSBonjourServices:
          - _impresario._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impresario.agent.AgentUITests-tvOS
        TEST_TARGET_NAME: AgentHost-tvOS
        SWIFT_OBJC_BRIDGING_HEADER: Xcode/AgentUITests/AgentUITests-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO

  # ------------------------------------------------------------------
  # The fixture app under test
  # ------------------------------------------------------------------
  AgentTargetStub-iOS:
    type: application
    platform: iOS
    sources:
      - path: Xcode/AgentTargetStub
        excludes: ["Info-*.plist"]
    dependencies:
      - package: ImpresarioAgent
        product: ImpresarioHook
    info:
      path: Xcode/AgentTargetStub/Info-iOS.plist
      properties:
        CFBundleDisplayName: Impresario Stub
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]

  AgentTargetStub-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Xcode/AgentTargetStub
        excludes: ["Info-*.plist"]
    dependencies:
      - package: ImpresarioAgent
        product: ImpresarioHook
    info:
      path: Xcode/AgentTargetStub/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Impresario Stub

schemes:
  AgentUITests-iOS:
    build:
      targets:
        AgentHost-iOS: all
        AgentUITests-iOS: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentUITests-iOS
  AgentUITests-tvOS:
    build:
      targets:
        AgentHost-tvOS: all
        AgentUITests-tvOS: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentUITests-tvOS
  AgentTargetStub-iOS:
    build:
      targets:
        AgentTargetStub-iOS: all
    run:
      config: Debug
  AgentTargetStub-tvOS:
    build:
      targets:
        AgentTargetStub-tvOS: all
    run:
      config: Debug
