# XcodeGen spec for Impresario Agent (spec TASK.md section 12).
#
#   brew install xcodegen
#   cd agents/apple && xcodegen generate          # writes ImpresarioAgent.xcodeproj
#
# The generated project is *not* committed (docs/DECISIONS.md I-89): it cannot be
# produced or opened on Windows, so the spec is the source of truth and the
# `.xcodeproj` is rebuilt on the macOS host that runs the devices.
#
# Targets
#   ImpresarioAgent-iOS / -tvOS      the host app and UI-test target application.
#                                    The app under test is *not* a build target:
#                                    the master names it via `app_id` and the
#                                    agent launches it with XCUIApplication.
#   ImpresarioAgentTests-iOS / -tvOS the UI-test bundle. Its `testServe` method
#                                    starts Impresario Agent with the XCUIDriver
#                                    and serves until `Shutdown`.
#   ImpresarioStub-iOS / -tvOS       the fixture app under test (same
#                                    accessibility ids as the Android stub).
#
# The `-Runner` names and `.xctrunner` suffix below are Xcode artifacts, not a
# product name. Bundle ids: iOS uses the agreed short ids. The P0 evidence
# build (tag `p0-tvos-evidence`) kept the legacy explicit-App-ID tvOS bundles
# because the existing free-team tvOS profiles are tied to them; the product
# line uses the short tvOS ids but needs fresh profiles before a hardware
# install. See docs/DEVICES.md §3.3.
#
# Usage on the host (see README.md):
#   xcodebuild build-for-testing -scheme ImpresarioAgentTests-iOS \
#     -destination 'platform=iOS,id=<udid>' -derivedDataPath build
name: ImpresarioAgent

options:
  bundleIdPrefix: com.impresario
  deploymentTarget:
    iOS: "16.0"
    tvOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.38.0"
  # Development signing: set DEVELOPMENT_TEAM in Xcode (Signing & Capabilities)
  # or add a Local.xcconfig; device runs need a team, simulator runs do not.

settings:
  base:
    # The XCUITest bundle drives XCUIApplication from a non-main serial queue and
    # the package is Swift 5.10; Swift 6 language mode would demand main-actor
    # isolation for every XCUIAutomation call. See docs/DECISIONS.md I-88.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TVOS_DEPLOYMENT_TARGET: "16.0"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  ImpresarioAgent:
    path: .

targets:
  # ------------------------------------------------------------------
  # Host apps (the UI-test bundle's target application)
  # ------------------------------------------------------------------
  ImpresarioAgent-iOS:
    type: application
    platform: iOS
    sources:
      - path: Xcode/ImpresarioAgent
        excludes: ["Info-*.plist"]
    info:
      path: Xcode/ImpresarioAgent/Info-iOS.plist
      properties:
        CFBundleDisplayName: Impresario Agent
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        # The XCUITest process binds the agent port; the host app shows the
        # permission prompt when XCTest launches it first (I-88).
        NSLocalNetworkUsageDescription: >-
          Impresario Agent serves automated UI sessions over your local network.
          The agent must be reachable by the build machine to receive commands.
        NSBonjourServices:
          - _impresario._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impresario.agent
        PRODUCT_NAME: ImpresarioAgent
        GENERATE_INFOPLIST_FILE: NO

  ImpresarioAgent-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Xcode/ImpresarioAgent
        excludes: ["Info-*.plist"]
      - path: Xcode/Shared/Assets.xcassets
    info:
      path: Xcode/ImpresarioAgent/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Impresario Agent
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: App Icon
        NSLocalNetworkUsageDescription: >-
          Impresario Agent serves automated UI sessions over your local network.
          The agent must be reachable by the build machine to receive commands.
        NSBonjourServices:
          - _impresario._tcp
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.impresario.agent
        PRODUCT_NAME: ImpresarioAgent
        GENERATE_INFOPLIST_FILE: NO

  # ------------------------------------------------------------------
  # The agent UI-test bundles
  # ------------------------------------------------------------------
  ImpresarioAgentTests-iOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Xcode/ImpresarioAgentTests
        excludes: ["Info-*.plist"]
    dependencies:
      - target: ImpresarioAgent-iOS
      - package: ImpresarioAgent
        product: AgentCore
      - package: ImpresarioAgent
        product: AgentService
    info:
      path: Xcode/ImpresarioAgentTests/Info-iOS.plist
      properties:
        CFBundleDisplayName: Impresario Agent Tests
        # Required: without the usage description the agent is terminated the
        # first time it serves the local network (iOS 14+).
        NSLocalNetworkUsageDescription: >-
          Impresario Agent serves automated UI sessions over your local network.
          The agent must be reachable by the build machine to receive commands.
        NSBonjourServices:
          - _impresario._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impresario.agent.tests
        PRODUCT_NAME: ImpresarioAgentTests
        TEST_TARGET_NAME: ImpresarioAgent-iOS
        SWIFT_OBJC_BRIDGING_HEADER: Xcode/ImpresarioAgentTests/ImpresarioAgentTests-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO

  ImpresarioAgentTests-tvOS:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: Xcode/ImpresarioAgentTests
        excludes: ["Info-*.plist"]
    dependencies:
      - target: ImpresarioAgent-tvOS
      - package: ImpresarioAgent
        product: AgentCore
      - package: ImpresarioAgent
        product: AgentService
    info:
      path: Xcode/ImpresarioAgentTests/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Impresario Agent Tests
        NSLocalNetworkUsageDescription: >-
          Impresario Agent serves automated UI sessions over your local network.
          The agent must be reachable by the build machine to receive commands.
        NSBonjourServices:
          - _impresario._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impresario.agent.tests
        PRODUCT_NAME: ImpresarioAgentTests
        TEST_TARGET_NAME: ImpresarioAgent-tvOS
        SWIFT_OBJC_BRIDGING_HEADER: Xcode/ImpresarioAgentTests/ImpresarioAgentTests-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO

  # ------------------------------------------------------------------
  # The fixture app under test
  # ------------------------------------------------------------------
  ImpresarioStub-iOS:
    type: application
    platform: iOS
    sources:
      - path: Xcode/ImpresarioStub
        excludes: ["Info-*.plist"]
    dependencies:
      - package: ImpresarioAgent
        product: ImpresarioHook
    info:
      path: Xcode/ImpresarioStub/Info-iOS.plist
      properties:
        CFBundleDisplayName: Impresario Stub
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        # The opt-in hook posts JSON to 127.0.0.1 (D-41); keep ATS enabled
        # for everything else and allow only local traffic.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impresario.stub
        PRODUCT_NAME: ImpresarioStub
        GENERATE_INFOPLIST_FILE: NO

  ImpresarioStub-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Xcode/ImpresarioStub
        excludes: ["Info-*.plist"]
      - path: Xcode/Shared/Assets.xcassets
    dependencies:
      - package: ImpresarioAgent
        product: ImpresarioHook
    info:
      path: Xcode/ImpresarioStub/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Impresario Stub
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: App Icon
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.impresario.stub
        PRODUCT_NAME: ImpresarioStub
        GENERATE_INFOPLIST_FILE: NO

schemes:
  ImpresarioAgentTests-iOS:
    build:
      targets:
        ImpresarioAgent-iOS: all
        ImpresarioAgentTests-iOS: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ImpresarioAgentTests-iOS
  ImpresarioAgentTests-tvOS:
    build:
      targets:
        ImpresarioAgent-tvOS: all
        ImpresarioAgentTests-tvOS: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ImpresarioAgentTests-tvOS
  ImpresarioStub-iOS:
    build:
      targets:
        ImpresarioStub-iOS: all
    run:
      config: Debug
  ImpresarioStub-tvOS:
    build:
      targets:
        ImpresarioStub-tvOS: all
    run:
      config: Debug
