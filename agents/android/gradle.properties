# IPv6 preference is required on this host: IPv4 egress to the plugin
# repositories times out while IPv6 works (documented in docs/DEVICES.md).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.net.preferIPv6Addresses=true
systemProp.java.net.preferIPv6Addresses=true

org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
