<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Impresario deep frame fixture</title>
<style>
  html, body { margin: 0; padding: 0; font: 16px sans-serif; }
  #deep-button { position: absolute; left: 20px; top: 10px; width: 120px; height: 36px; }
  #deep-tap { position: absolute; left: 160px; top: 10px; width: 120px; height: 36px; }
  #deep-input { position: absolute; left: 20px; top: 50px; width: 220px; height: 28px; }
  #deep-result { position: absolute; left: 20px; top: 90px; }
</style>
</head>
<body>
  <button id="deep-button" onclick="document.getElementById('deep-result').textContent = 'deep-clicked'">Deep</button>
  <button id="deep-tap" onclick="document.getElementById('deep-result').textContent = 'tap-clicked'">Tap</button>
  <input id="deep-input" type="text" value="">
  <div id="deep-result">idle</div>
  <script>
    document.getElementById('deep-input').addEventListener('keydown', function (event) {
      document.getElementById('deep-result').textContent = 'key-' + String(event.keyCode);
    });
  </script>
</body>
</html>
