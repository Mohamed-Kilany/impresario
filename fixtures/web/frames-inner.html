<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Impresario inner frame fixture</title>
<style>
  html, body { margin: 0; padding: 0; font: 16px sans-serif; }
  #inner-button { position: absolute; left: 40px; top: 30px; width: 160px; height: 40px; }
  #inner-input { position: absolute; left: 40px; top: 90px; width: 220px; height: 32px; }
  #inner-result { position: absolute; left: 40px; top: 140px; }
  /* Below this frame's 300px viewport but still inside the top viewport:
     only frame-aware clipping can prune it. */
  #inner-offscreen { position: absolute; left: 40px; top: 350px; }
  #deep-frame {
    position: absolute;
    left: 30px;
    top: 170px;
    width: 300px;
    height: 120px;
    border: 4px solid #555555;
    padding: 0;
    box-sizing: content-box;
  }
</style>
</head>
<body>
  <button id="inner-button" onclick="document.getElementById('inner-result').textContent = 'inner-clicked'">Inner</button>
  <input id="inner-input" type="text" value="">
  <div id="inner-result">idle</div>
  <div id="inner-offscreen">offscreen</div>
  <iframe id="deep-frame" src="frames-deep.html" title="deep frame"></iframe>
</body>
</html>
