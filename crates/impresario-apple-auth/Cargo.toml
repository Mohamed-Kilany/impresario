[package]
name = "impresario-apple-auth"
description = "Rust Apple ID authentication and free-provisioning developer session for Impresario (vendored from isideload 0.5.0, signer removed)."
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
authors = ["Nicholas Sharp <nab@nabdev.me>", "impresario contributors"]

[lib]
name = "impresario_apple_auth"
path = "src/lib.rs"

[features]
default = ["tokio-mt"]
tokio-mt = ["tokio/rt-multi-thread", "dep:tokio-tungstenite"]
# The upstream wasm proxy is not part of Impresario's host-side flow, but the
# cfg gates are kept so the vendored files stay close to upstream.
wasm = []

[dependencies]
aes = "0.9.0"
aes-gcm = "0.11.1"
async-trait = "0.1.89"
base64 = "0.22.1"
cbc = { version = "0.2.0", features = ["alloc"] }
futures = "0.3.32"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.4.0"
keyring.workspace = true
pbkdf2 = "0.13.0"
plist = "1.8"
plist-macro = "0.1.4"
rand = "0.8.5"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "gzip", "rustls-no-provider", "http2", "charset", "system-proxy"] }
reqwest-middleware = "0.5.1"
rootcause = "0.12.0"
rsa = { version = "0.9.10", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.11.0"
sha2 = "0.11.0"
srp = "0.7.0-rc.3"
thiserror = "2.0.17"
tokio = { version = "1.49", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"], optional = true }
tracing = "0.1.44"
urlencoding = "2.1.3"
uuid = { version = "1.20.0", features = ["v4"] }
web-time = "1"
