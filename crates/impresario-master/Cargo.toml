[package]
name = "impresario-master"
description = "The `impresario` CLI: planner, executor, reporters, embedded LSP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "impresario_master"
path = "src/lib.rs"

[[bin]]
name = "impresario"
path = "src/main.rs"

[dependencies]
impresario-core = { path = "../impresario-core" }
impresario-clients = { path = "../impresario-clients" }
impresario-proto = { path = "../impresario-proto" }
clap.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true
tokio-stream.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
miette.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
quick-junit.workspace = true
tower-lsp-server.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
glob.workspace = true
base64.workspace = true
async-trait.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
insta.workspace = true
tokio = { workspace = true, features = ["test-util"] }
