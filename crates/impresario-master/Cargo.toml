[package]
name = "impresario-master"
description = "The `impresario` CLI: planner, executor, reporters, embedded LSP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "impresario_master"
path = "src/lib.rs"

[[bin]]
name = "impresario"
path = "src/main.rs"

[dependencies]
impresario-core = { path = "../impresario-core" }
impresario-language = { path = "../impresario-language" }
impresario-clients = { path = "../impresario-clients" }
impresario-proto = { path = "../impresario-proto" }
clap.workspace = true
clap_complete.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true
tokio-stream.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
yaml-edit.workspace = true
thiserror.workspace = true
miette.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
quick-junit.workspace = true
tower-lsp-server.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
glob.workspace = true
base64.workspace = true
async-trait.workspace = true
ureq.workspace = true
sha2.workspace = true
zip.workspace = true
ratatui.workspace = true
crossterm.workspace = true
interprocess.workspace = true
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# The managed Chromium archive is not installed by Chrome's installer, so its
# directory lacks the AppContainer ACEs the Windows sandbox needs. Grant them
# with the OS API; no `icacls` shell-out (TASK-2 D-19).
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
insta.workspace = true
tokio = { workspace = true, features = ["test-util"] }
portable-pty = "=0.9.0"
