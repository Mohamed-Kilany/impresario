<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impresario Inspector</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Impresario <span>Inspector</span></div>
  <div class="device-picker">
    <label class="sr-only" for="device-select">Device</label>
    <select id="device-select" aria-label="Device"></select>
    <button id="attach" type="button">Attach</button>
    <button id="detach" class="secondary" type="button">Detach</button>
    <span id="attach-status" class="pill">disconnected</span>
  </div>
  <div class="top-actions">
    <label class="check"><input type="checkbox" id="freeze"> Freeze</label>
    <button id="refresh" class="secondary" type="button">Refresh</button>
    <span id="rev" class="muted"></span>
  </div>
</header>
<main class="layout">
  <aside class="left panel">
    <h2>View</h2>
    <label class="field">Search tree
      <input id="tree-filter" type="search" placeholder="role, name or text" autocomplete="off">
    </label>
    <div class="row">
      <button id="expand-all" class="secondary" type="button">Expand</button>
      <button id="collapse-all" class="secondary" type="button">Collapse</button>
    </div>
    <div id="device-meta" class="meta">No device attached.</div>

    <h2>Locator</h2>
    <label class="field">Locator
      <input id="locator-input" placeholder="role=button[name=&quot;Play&quot;]" autocomplete="off" spellcheck="false">
    </label>
    <div class="row">
      <button id="resolve" type="button">Resolve</button>
      <button id="verify" class="secondary" type="button">Verify</button>
      <button id="clear-matches" class="secondary" type="button">Clear</button>
    </div>
    <div id="locator-result" class="result"></div>

    <h2>Remote</h2>
    <div class="dpad" aria-label="Remote keys">
      <button type="button" data-key="up" title="D-pad up">▲</button>
      <button type="button" data-key="left" title="D-pad left">◀</button>
      <button type="button" data-key="ok" title="OK / Enter">OK</button>
      <button type="button" data-key="right" title="D-pad right">▶</button>
      <button type="button" data-key="down" title="D-pad down">▼</button>
      <button type="button" data-key="back" title="Back">Back</button>
      <button type="button" data-key="home" title="Home">Home</button>
    </div>

    <h2>Scene</h2>
    <label class="field">Scene
      <select id="scene-select" aria-label="Scene"></select>
    </label>
    <div class="row">
      <button id="scene-open" class="secondary" type="button">Open</button>
      <button id="scene-new" class="secondary" type="button">New</button>
    </div>
    <div id="scene-meta" class="meta">No scene open.</div>
    <div id="scene-table" class="scene-table"></div>
    <div id="scene-actions" class="stack"></div>
    <div id="scene-edit" class="scene-edit"></div>
  </aside>

  <section class="center panel">
    <div id="stage" class="stage">
      <img id="screenshot" alt="Device screen" draggable="false">
      <canvas id="overlay" aria-hidden="true"></canvas>
      <div id="stage-empty" class="empty">Attach a device to inspect its screen.</div>
    </div>
    <div class="inputbar" id="inputbar">
      <button id="tap-selected" class="primary" type="button" title="Tap the selected element">Tap</button>
      <button id="scroll-up" class="secondary" type="button" title="Scroll up">↑</button>
      <button id="scroll-down" class="secondary" type="button" title="Scroll down">↓</button>
      <button id="scroll-left" class="secondary" type="button" title="Scroll left">←</button>
      <button id="scroll-right" class="secondary" type="button" title="Scroll right">→</button>
      <select id="key-select" aria-label="Remote key"></select>
      <button id="send-key" class="secondary" type="button">Key</button>
      <input id="type-text" placeholder="Text to type" autocomplete="off">
      <button id="send-type" class="secondary" type="button">Type</button>
      <span id="input-status" class="muted"></span>
    </div>
    <div class="statusline">
      <span id="status-text">No device attached</span>
      <span id="fps" class="muted"></span>
    </div>
  </section>

  <aside class="right panel">
    <div class="tree-head">
      <h2>Tree</h2>
      <span id="tree-count" class="tree-count" aria-live="polite"></span>
    </div>
    <div id="tree" class="tree" role="tree" aria-label="Accessibility tree"></div>
    <h2>Selection</h2>
    <div id="details" class="details">Nothing selected.</div>
    <h2>Locator candidates</h2>
    <div id="suggestions" class="suggestions"></div>
  </aside>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/assets/app.js"></script>
</body>
</html>
