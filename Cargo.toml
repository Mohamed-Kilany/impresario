[workspace]
resolver = "2"
members = [
    "crates/impresario-proto",
    "crates/impresario-core",
    "crates/impresario-language",
    "crates/impresario-language-wasm",
    "crates/impresario-clients",
    "crates/impresario-connector",
    "crates/impresario-master",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["impresario contributors"]

[workspace.dependencies]
# async runtime
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "net", "process", "io-util", "sync", "signal", "fs"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tokio-stream = { version = "0.1.17", features = ["net", "sync"] }
futures = "0.3.34"
async-trait = "0.1.89"

# protobuf / gRPC
prost = "0.14.4"
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
prost-build = "0.14.4"
tonic-prost-build = "0.14.6"
protoc-bin-vendored = "3.3.0"

# serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
yaml-edit = "=0.3.2"

# errors / diagnostics
thiserror = "2.0.21"
miette = { version = "7.6.0", features = ["fancy-no-backtrace", "derive"] }

# parsing
winnow = { version = "1.0.4", features = ["ascii"] }
regex = "1.13.1"
unicode-width = "0.2.2"
url = "2.5.8"

# cli / logging
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "=4.6.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "ansi"] }

# TUI and local background jobs (S-5).
ratatui = "=0.30.2"
crossterm = "=0.29.0"
interprocess = "=2.4.6"
getrandom = "=0.4.3"
libc = "=0.2.190"

# networking / websockets
tokio-tungstenite = { version = "0.30.0", features = ["connect", "handshake"] }
base64 = "0.23.1"
mdns-sd = "=0.21.6"

# Android Debug Bridge protocol (TASK-2 6.1): no adb binary.
libadb = { version = "=0.6.0", default-features = false, features = ["tokio", "host-keys", "tls", "pairing", "nusb"] }
nusb = "=0.1.14"

# Managed tool downloads (TASK-2 6.0 rung 3): checksum-verified archives.
ureq = "=2.12.1"
sha2 = "=0.10.9"
zip = { version = "=7.3.0", default-features = false, features = ["deflate-flate2"] }

# reporting
quick-junit = "0.8.0"

# LSP
tower-lsp-server = "0.23.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

# misc
glob = "0.3.3"
bytes = "1.12.1"
tempfile = "3.27.0"

# optional CDP backend
chromiumoxide = { version = "0.9.1", default-features = false }

# testing
insta = { version = "1.49.0", features = ["yaml", "json"] }
proptest = "1.12.0"
assert_cmd = "2.2.2"
predicates = "3.1.3"

[profile.release]
lto = "thin"
