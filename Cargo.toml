[workspace]
resolver = "2"
members = [
    "crates/impresario-proto",
    "crates/impresario-core",
    "crates/impresario-language",
    "crates/impresario-language-wasm",
    "crates/impresario-clients",
    "crates/impresario-apple-auth",
    "crates/impresario-apple-device",
    "crates/impresario-connector",
    "crates/impresario-master",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["impresario contributors"]

[workspace.dependencies]
# async runtime
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "net", "process", "io-util", "sync", "signal", "fs"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tokio-stream = { version = "0.1.17", features = ["net", "sync"] }
futures = "0.3.34"
async-trait = "0.1.89"

# protobuf / gRPC
prost = "0.14.4"
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
prost-build = "0.14.4"
tonic-prost-build = "0.14.6"
protoc-bin-vendored = "3.3.0"

# serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
yaml-edit = "=0.3.2"

# errors / diagnostics
thiserror = "2.0.21"
miette = { version = "7.6.0", features = ["fancy-no-backtrace", "derive"] }

# parsing
winnow = { version = "1.0.4", features = ["ascii"] }
regex = "1.13.1"
unicode-width = "0.2.2"
url = "2.5.8"

# cli / logging
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
rpassword = "=7.4.0"
zeroize = "=1.9.1"
clap_complete = "=4.6.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "ansi"] }

# TUI and local background jobs (S-5).
ratatui = "=0.30.2"
crossterm = "=0.29.0"
interprocess = "=2.4.6"
getrandom = "=0.4.3"
libc = "=0.2.190"

# networking / websockets
tokio-tungstenite = { version = "0.30.0", features = ["connect", "handshake"] }
base64 = "0.23.1"
mdns-sd = "=0.21.6"

# Android Debug Bridge protocol (TASK-2 6.1): no adb binary.
libadb = { version = "=0.6.0", default-features = false, features = ["tokio", "host-keys", "tls", "pairing", "nusb"] }
nusb = "=0.1.14"

# Managed tool downloads (TASK-2 6.0 rung 3): checksum-verified archives.
ureq = "=2.12.1"
sha2 = "=0.10.9"
zip = { version = "=7.3.0", default-features = false, features = ["deflate-flate2"] }

# Tool-free webOS/Tizen transports and package signing (TASK-2 6.3, 6.4, 7.3, 7.4).
# russh's aws-lc-rs default needs NASM on Windows; ring has no C toolchain
# requirement here (SPIKES S-3).
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "=3.0.1"
rsa = { version = "=0.9.10", features = ["sha2"] }
# Tizen WGT ECDSA signing (P-256/P-384). These stable releases share the
# signature 2.x traits used by rsa 0.9, so raw r||s values convert cleanly.
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8"] }
p384 = { version = "=0.13.1", features = ["ecdsa", "pkcs8"] }
# russh/ssh-key use the 0.10 release-candidate line; alias it so the webOS
# dev-key fallback can build an ssh-key RsaKeypair without a second graph.
rsa-russh = { package = "rsa", version = "=0.10.0-rc.18" }
pkcs1-russh = { package = "pkcs1", version = "=0.8.0-rc.4" }
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["alloc"] }
md-5 = "=0.10.6"
sha1 = "=0.10.6"
flate2 = "=1.1.4"
tar = "=0.4.46"
ar = "=0.9.0"
p12-keystore = "=0.4.1"
rcgen = "=0.14.10"
ua-cryptography-xml-c14n = "=0.1.6"
x509-parser = "=0.18.0"

# Apple device services (RemotePairing/RSD/AFC/installation/XCUITest) are
# pure Rust. The crate is vendored only for the direct outer-RSD XCUITest
# entry point; see vendor/idevice/PATCHES.md.
idevice = { version = "=0.1.68", default-features = false }
apple-codesign = { version = "=0.29.0", default-features = false }
cryptographic-message-syntax = "=0.27.0"
x509-certificate = "=0.24.0"
roxmltree = "=0.21.1"
keyring = "=4.2.0"

# reporting
quick-junit = "0.8.0"

# LSP
tower-lsp-server = "0.23.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

# misc
glob = "0.3.3"
bytes = "1.12.1"
tempfile = "3.27.0"

# optional CDP backend
chromiumoxide = { version = "0.9.1", default-features = false }

# testing
insta = { version = "1.49.0", features = ["yaml", "json"] }
proptest = "1.12.0"
assert_cmd = "2.2.2"
predicates = "3.1.3"

[profile.release]
lto = "thin"

# srp 0.7.0-rc.3 calls `Array::ct_eq` with a slice; subtle 2.6 only offers the
# slice impl once the receiver is coerced. The patch is limited to four
# `as_slice()` calls and is documented in docs/THIRD_PARTY.md.
[patch.crates-io]
srp = { path = "vendor/srp" }
idevice = { path = "vendor/idevice" }
