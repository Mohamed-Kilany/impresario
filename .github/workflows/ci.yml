# CI (spec 17/18). The Rust gates run on Ubuntu (which ships
# google-chrome — the connector fixture suite needs it); the Android JVM
# unit tests run with JDK 17 + the Android SDK. An Apple job lands together
# with the Apple agent (needs macOS/Xcode; see docs/STATUS.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
        env:
          RUST_BACKTRACE: "1"

  android:
    name: android (JVM unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Unit tests
        working-directory: agents/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test
