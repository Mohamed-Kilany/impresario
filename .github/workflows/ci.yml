# CI (spec 17/18). The Rust gates run on Ubuntu (which ships
# google-chrome — the connector fixture suite needs it); the Android JVM
# unit tests run with JDK 17 + the Android SDK; the Apple job builds and
# unit-tests the Swift package on Linux (the Xcode runner targets need
# macOS/Xcode and are covered by the checklist in docs/DEVICES.md §3.2).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
        env:
          RUST_BACKTRACE: "1"

  editor:
    name: editor (TypeScript, WASM corpus, VS Code host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install
        working-directory: editors/vscode
        run: npm ci
      - name: Build WASM
        working-directory: editors/vscode
        run: npm run build:wasm
      - name: TypeScript and ESLint
        working-directory: editors/vscode
        run: npm run check
      - name: Unit, corpus and extension-host tests
        working-directory: editors/vscode
        # The extension host needs a display; xvfb-run is preinstalled.
        run: xvfb-run -a npm test
      - name: Package VSIX
        working-directory: editors/vscode
        run: npm run package

  android:
    name: android (JVM unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Unit tests
        working-directory: agents/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

  apple:
    name: "apple (Swift package: build, unit tests)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.4.1"
      # SwiftPM on Linux links the corelibs against zlib (the same dependency
      # the WSL build needed, docs/DEVICES.md §3.1).
      - name: Toolchain dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Resolve
        working-directory: agents/apple
        run: swift package resolve
      - name: Build
        working-directory: agents/apple
        run: swift build
      - name: Tests
        working-directory: agents/apple
        run: swift test
