# CI (spec 17/18). Every gate is a separate job so the Actions UI names the
# stage that failed. The Rust gates run on Ubuntu (which ships google-chrome —
# the connector fixture suite needs it); the Windows job builds the release
# CLI/connector; the Android JVM unit tests run with JDK 17 + the Android SDK;
# the Apple job builds and unit-tests the Swift package on Linux (the Xcode
# runner targets need macOS/Xcode and are covered by the checklist in
# docs/DEVICES.md §3.2). The final `gate` job is the single aggregate check.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 5

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test (ubuntu-latest)
    runs-on: ubuntu-latest
    # The toolchain's lld dies with SIGBUS when the large
    # impresario-master and impresario-clients test binaries link in
    # parallel. Keep CI-only dev/test artifacts free of debug info and
    # link them one at a time; release artifacts are unaffected.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --locked --jobs 1
        env:
          RUST_BACKTRACE: "1"

  windows:
    name: windows (release build)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI and connector
        run: cargo build --locked -p impresario-master -p impresario-connector --release
      - name: Upload CLI and connector
        uses: actions/upload-artifact@v4
        with:
          name: impresario-windows-x64
          path: |
            target/release/impresario.exe
            target/release/impresario-connector.exe
          if-no-files-found: error
          retention-days: 14

  editor:
    name: editor (TypeScript, WASM corpus, VS Code host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install
        working-directory: editors/vscode
        run: npm ci
      - name: Build WASM
        working-directory: editors/vscode
        run: npm run build:wasm
      - name: TypeScript and ESLint
        working-directory: editors/vscode
        run: npm run check
      - name: Unit, corpus and extension-host tests
        working-directory: editors/vscode
        # The extension host needs a display; xvfb-run is preinstalled.
        run: xvfb-run -a npm test
      - name: Package VSIX
        working-directory: editors/vscode
        run: npm run package

  android:
    name: android (JVM unit tests, APKs)
    runs-on: ubuntu-latest
    env:
      # GitHub runners have no IPv6 route; Gradle's dependency downloads can
      # try IPv6 first and fail with "Network is unreachable".
      GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Recent SDK releases no longer publish the legacy `tools` package;
          # the action's default `tools platform-tools` then fails. Install
          # only what Gradle needs for compileSdk 36.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install Gradle (retry-safe, mirrored)
        # The wrapper downloads from services.gradle.org only; that host
        # returned persistent HTTP 504s from the hosted runner. Fetch the
        # same 9.6.0 distribution from mirrors, verify the official SHA-256,
        # and put it on PATH for the remaining steps.
        run: |
          set -euo pipefail
          GRADLE_VERSION=9.6.0
          GRADLE_SHA256=bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01
          ZIP="$RUNNER_TEMP/gradle-bin.zip"
          for URL in \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            "https://repo.huaweicloud.com/gradle/gradle-${GRADLE_VERSION}-bin.zip" \
            "https://mirrors.cloud.tencent.com/gradle/gradle-${GRADLE_VERSION}-bin.zip"; do
            echo "downloading $URL"
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o "$ZIP" "$URL"; then
              break
            fi
          done
          echo "$GRADLE_SHA256  $ZIP" | sha256sum -c -
          unzip -q "$ZIP" -d "$RUNNER_TEMP/gradle-dist"
          echo "$RUNNER_TEMP/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        working-directory: agents/android
        run: |
          for attempt in 1 2 3; do
            gradle --no-daemon test && exit 0
            echo "Gradle attempt $attempt failed; retrying" >&2
            sleep 15
          done
          exit 1
      - name: Assemble agent APKs
        working-directory: agents/android
        run: gradle --no-daemon assembleDebug
      - name: Upload agent APKs
        uses: actions/upload-artifact@v4
        with:
          name: impresario-android-agent
          if-no-files-found: error
          retention-days: 14
          path: |
            agents/android/agent/build/outputs/apk/debug/agent-debug.apk
            agents/android/agent-instrumentation/build/outputs/apk/debug/agent-instrumentation-debug.apk
            agents/android/agent-target-stub/build/outputs/apk/debug/agent-target-stub-debug.apk

  apple:
    name: "apple (Swift package: build, unit tests)"
    # setup-swift v2 does not yet recognize Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          # Pin the major/minor line; the package is tools-version 5.10 and
          # builds on any supported Swift 6.x. (The exact 6.4.1 toolchain used
          # in WSL is not published by this action.)
          swift-version: "6.2"
      # SwiftPM on Linux links the corelibs against zlib (the same dependency
      # the WSL build needed, docs/DEVICES.md §3.1).
      - name: Toolchain dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Resolve
        working-directory: agents/apple
        run: swift package resolve
      - name: Build
        working-directory: agents/apple
        run: swift build
      - name: Tests
        working-directory: agents/apple
        run: swift test

  gate:
    name: all checks
    if: always()
    needs: [fmt, clippy, test, windows, editor, android, apple]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        run: |
          echo "fmt=${{ needs.fmt.result }}"
          echo "clippy=${{ needs.clippy.result }}"
          echo "test=${{ needs.test.result }}"
          echo "windows=${{ needs.windows.result }}"
          echo "editor=${{ needs.editor.result }}"
          echo "android=${{ needs.android.result }}"
          echo "apple=${{ needs.apple.result }}"
          test "${{ needs.fmt.result }}" = "success"
          test "${{ needs.clippy.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.windows.result }}" = "success"
          test "${{ needs.editor.result }}" = "success"
          test "${{ needs.android.result }}" = "success"
          test "${{ needs.apple.result }}" = "success"
