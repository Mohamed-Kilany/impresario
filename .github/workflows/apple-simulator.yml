name: Apple Simulator Tests

# Run the real XCUITest agent on iOS, iPadOS and tvOS **simulators** on a
# GitHub-hosted macOS runner. No Mac is needed on the developer's desk: from
# Windows or Linux, trigger this workflow with `gh` (scripts/apple-tests.ps1 or
# scripts/apple-tests.sh). Physical Apple TV installation still needs a macOS
# host on the same LAN (docs/DEVICES.md section 3.2).
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which simulator family to run"
        required: false
        type: choice
        default: all
        options:
          - all
          - ios
          - ipados
          - tvos
  push:
    paths:
      - "agents/apple/**"
      - "crates/impresario-clients/src/transport.rs"
      - "scripts/apple-simulator.py"
      - "scripts/apple-tests.ps1"
      - "scripts/apple-tests.sh"
      - ".github/workflows/apple-simulator.yml"
  pull_request:
    paths:
      - "agents/apple/**"
      - "crates/impresario-clients/src/transport.rs"
      - "scripts/apple-simulator.py"
      - "scripts/apple-tests.ps1"
      - "scripts/apple-tests.sh"
      - ".github/workflows/apple-simulator.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: "Plan simulator matrix"
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Select simulator families
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          choice='${{ inputs.platforms }}'
          ios='{"name":"ios","sim_kind":"iphone","destination_platform":"iOS Simulator","scheme":"AgentUITests-iOS","stub_scheme":"AgentTargetStub-iOS","bundle":"com.impresario.agent.AgentUITests-iOS","products":"Debug-iphonesimulator","config_platform":"ios"}'
          ipados='{"name":"ipados","sim_kind":"ipad","destination_platform":"iOS Simulator","scheme":"AgentUITests-iOS","stub_scheme":"AgentTargetStub-iOS","bundle":"com.impresario.agent.AgentUITests-iOS","products":"Debug-iphonesimulator","config_platform":"ios"}'
          tvos='{"name":"tvos","sim_kind":"appletv","destination_platform":"tvOS Simulator","scheme":"AgentUITests-tvOS","stub_scheme":"AgentTargetStub-tvOS","bundle":"com.impresario.agent.AgentUITests-tvOS","products":"Debug-appletvsimulator","config_platform":"tvos"}'
          case "$choice" in
            ""|all) printf 'include=[%s,%s,%s]\n' "$ios" "$ipados" "$tvos" >> "$GITHUB_OUTPUT" ;;
            ios) printf 'include=[%s]\n' "$ios" >> "$GITHUB_OUTPUT" ;;
            ipados) printf 'include=[%s]\n' "$ipados" >> "$GITHUB_OUTPUT" ;;
            tvos) printf 'include=[%s]\n' "$tvos" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown platform selection '$choice'" >&2; exit 2 ;;
          esac

  simulator:
    name: "${{ matrix.name }} simulator"
    needs: plan
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version
          python3 --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: agents/apple
        run: xcodegen generate

      - name: Boot simulator
        id: sim
        run: |
          set -euo pipefail
          UDID="$(python3 scripts/apple-simulator.py boot '${{ matrix.sim_kind }}')"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep -F "$UDID" || true

      - name: Build fixture and UI-test runner for the simulator
        working-directory: agents/apple
        run: |
          set -euo pipefail
          DERIVED="$PWD/build-${{ matrix.name }}"
          echo "DERIVED=$DERIVED" >> "$GITHUB_ENV"
          DEST="platform=${{ matrix.destination_platform }},id=$UDID"

          xcodebuild -project ImpresarioApple.xcodeproj \
            -scheme '${{ matrix.stub_scheme }}' -configuration Debug \
            -destination "$DEST" -derivedDataPath "$DERIVED" \
            build

          xcodebuild -project ImpresarioApple.xcodeproj \
            -scheme '${{ matrix.scheme }}' -configuration Debug \
            -destination "$DEST" -derivedDataPath "$DERIVED" \
            build-for-testing

          XCTESTRUN="$(find "$DERIVED/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)"
          test -n "$XCTESTRUN"
          echo "XCTESTRUN=$XCTESTRUN" >> "$GITHUB_ENV"

      - name: Install the fixture app
        working-directory: agents/apple
        run: |
          set -euo pipefail
          STUB_APP="$DERIVED/Build/Products/${{ matrix.products }}/${{ matrix.stub_scheme }}.app"
          test -d "$STUB_APP"
          xcrun simctl install "$UDID" "$STUB_APP"

      - name: Make the runner deterministic (no Bonjour prompt)
        run: |
          set -euo pipefail
          if ! plutil -extract TestingEnvironmentVariables xml1 -o /dev/null "$XCTESTRUN"; then
            plutil -insert TestingEnvironmentVariables -dictionary "$XCTESTRUN"
          fi
          for pair in 'IMPRESARIO_NO_BONJOUR:1' 'IMPRESARIO_AGENT_PORT:50062'; do
            key="${pair%%:*}"
            value="${pair#*:}"
            if plutil -extract "TestingEnvironmentVariables.$key" raw -o /dev/null "$XCTESTRUN" 2>/dev/null; then
              plutil -replace "TestingEnvironmentVariables.$key" -string "$value" "$XCTESTRUN"
            else
              plutil -insert "TestingEnvironmentVariables.$key" -string "$value" "$XCTESTRUN"
            fi
          done

      - name: "Run XCUIDriver smoke test (launch, accessibility, screenshot, hook)"
        working-directory: agents/apple
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$UDID" \
            -only-testing '${{ matrix.bundle }}/SimulatorSmokeTests/testDriverAgainstStub' \
            -parallel-testing-enabled NO \
            -resultBundlePath "$PWD/${{ matrix.name }}-smoke.xcresult" \
            2>&1 | tee "$PWD/${{ matrix.name }}-smoke.log"

      - name: Build the Rust master
        run: cargo build --release --locked --bin impresario

      - name: Run an Impresario play through the simulator agent
        working-directory: agents/apple
        run: |
          set -euo pipefail
          cat > ci/impresario.devices.config <<EOF
          devices:
            - name: simulator
              platform: ${{ matrix.config_platform }}
              connection:
                udid: "$UDID"
          EOF

          ../../target/release/impresario \
            --workspace ci --no-tui --plain --no-color validate

          set +e
          IMPRESARIO_XCTESTRUN="$XCTESTRUN" \
          IMPRESARIO_AGENT_START_TIMEOUT_MS=180000 \
            ../../target/release/impresario \
              --workspace ci --no-tui --plain --no-color run \
              --play apple-smoke.play --device simulator --app stub \
              2>&1 | tee "$PWD/${{ matrix.name }}-e2e.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            xcrun simctl io "$UDID" screenshot "$PWD/${{ matrix.name }}-failure.png" || true
          fi
          exit "$status"

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-simulator-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            agents/apple/${{ matrix.name }}-smoke.log
            agents/apple/${{ matrix.name }}-smoke.xcresult
            agents/apple/${{ matrix.name }}-e2e.log
            agents/apple/${{ matrix.name }}-failure.png
            agents/apple/ci/reports/**
            agents/apple/ci/impresario.devices.config
            agents/apple/ci/plays/**
            agents/apple/ci/scenes/**
            agents/apple/ci/theatres/**

      - name: Collect simulator diagnostics
        if: failure()
        run: |
          xcrun simctl spawn "$UDID" log show --last 10m --style compact \
            > "agents/apple/${{ matrix.name }}-simulator.log" || true

      - name: Upload simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-simulator-${{ matrix.name }}-diagnostics
          if-no-files-found: warn
          path: agents/apple/${{ matrix.name }}-simulator.log

      - name: Shut down the simulator
        if: always()
        run: xcrun simctl shutdown "$UDID" || true
