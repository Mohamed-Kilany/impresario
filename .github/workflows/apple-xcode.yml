name: Apple Xcode

# Compile the Xcode-only Apple targets on a macOS runner. This verifies
# Impresario Agent for Apple, the fixture app and project.yml; it does not run
# on a device and cannot reach a LAN Apple TV. Device installation/signing uses
# the pure-Rust host path (docs/DEVICES.md section 3.3).
on:
  workflow_dispatch:
  push:
    paths:
      - "agents/apple/**"
      - ".github/workflows/apple-xcode.yml"
  pull_request:
    paths:
      - "agents/apple/**"
      - ".github/workflows/apple-xcode.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "macOS: generate + build tvOS/iOS (unsigned)"
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: agents/apple
        run: xcodegen generate

      - name: Validate tvOS asset catalog
        working-directory: agents/apple
        run: |
          set +e
          run_actool() {
            name="$1"; shift
            out="/tmp/impresario-actool-$name"
            mkdir -p "$out"
            xcrun actool Xcode/Shared/Assets.xcassets \
              --compile "$out" \
              --output-format human-readable-text \
              --notices --warnings \
              --compress-pngs \
              --enable-on-demand-resources YES \
              --development-region en \
              --target-device tv \
              --minimum-deployment-target 16.0 \
              --platform appletvos "$@" > "$out.log" 2>&1
            status=$?
            echo "=== actool $name: $status ==="
            cat "$out.log"
            return 0
          }
          run_actool partial --app-icon AppIcon \
            --output-partial-info-plist /tmp/impresario-actool-partial.plist
          run_actool partial-bundle --app-icon AppIcon \
            --bundle-identifier com.impresario.stub \
            --output-partial-info-plist /tmp/impresario-actool-partial-bundle.plist
          PRODUCT_BUNDLE_IDENTIFIER=com.impresario.stub run_actool partial-env --app-icon AppIcon \
            --output-partial-info-plist /tmp/impresario-actool-partial-env.plist
          run_actool partial-in-output --app-icon AppIcon \
            --output-partial-info-plist /tmp/impresario-actool-partial-in-output/info.plist
          run_actool partial-no-icon \
            --output-partial-info-plist /tmp/impresario-actool-partial-no-icon.plist
          run_actool partial-launch --app-icon AppIcon --launch-image LaunchImage \
            --output-partial-info-plist /tmp/impresario-actool-partial-launch.plist
          run_actool partial-leaderboard --app-icon AppIcon \
            --leaderboard-identifier-prefix ImpresarioStub.game-center.leaderboard. \
            --leaderboard-set-identifier-prefix ImpresarioStub.game-center.leaderboard-set. \
            --output-partial-info-plist /tmp/impresario-actool-partial-leaderboard.plist

      - name: Collect actool diagnostics
        if: always()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports || true
          find ~/Library/Logs/DiagnosticReports -maxdepth 1 -name 'actool*' -print -exec cat {} \; || true
          log show --last 10m --predicate 'process == "actool"' --style compact || true

      - name: Build tvOS stub and agent tests (unsigned)
        working-directory: agents/apple
        run: |
          set -o pipefail
          xcodebuild -project ImpresarioAgent.xcodeproj \
            -scheme ImpresarioStub-tvOS -configuration Debug \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build-tvos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= PROVISIONING_PROFILE_SPECIFIER= build
          xcodebuild -project ImpresarioAgent.xcodeproj \
            -scheme ImpresarioAgentTests-tvOS -configuration Debug \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build-tvos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= PROVISIONING_PROFILE_SPECIFIER= build-for-testing

      - name: Build iOS stub and agent tests (unsigned)
        working-directory: agents/apple
        run: |
          set -o pipefail
          xcodebuild -project ImpresarioAgent.xcodeproj \
            -scheme ImpresarioStub-iOS -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= PROVISIONING_PROFILE_SPECIFIER= build
          xcodebuild -project ImpresarioAgent.xcodeproj \
            -scheme ImpresarioAgentTests-iOS -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= PROVISIONING_PROFILE_SPECIFIER= build-for-testing

      - name: Upload unsigned products
        uses: actions/upload-artifact@v4
        with:
          name: impresario-apple-unsigned
          if-no-files-found: error
          path: |
            agents/apple/build-tvos/Build/Products/Debug-appletvos/*.app
            agents/apple/build-tvos/Build/Products/*.xctestrun
            agents/apple/build-ios/Build/Products/Debug-iphoneos/*.app
            agents/apple/build-ios/Build/Products/*.xctestrun
