name: Apple Xcode

# Compile the Xcode-only Apple targets on a macOS runner. This verifies
# Impresario Agent for Apple, the fixture app and project.yml; it does not run
# on a device and cannot reach a LAN Apple TV. Device installation/signing uses
# the pure-Rust host path (docs/DEVICES.md section 3.3).
on:
  workflow_dispatch:
  push:
    paths:
      - "agents/apple/**"
      - ".github/workflows/apple-xcode.yml"
  pull_request:
    paths:
      - "agents/apple/**"
      - ".github/workflows/apple-xcode.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Regenerate the committed Swift protobuf/gRPC sources from the current
  # proto with the pinned plugins (scripts/gen-swift.sh). The build job below
  # consumes the artifact, so a stale committed copy can never mask a proto
  # change; the artifact is also what a developer commits back to the repo.
  wire:
    name: "Swift wire sources (generated)"
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: brew install protobuf

      - name: Build pinned protoc plugins
        run: |
          set -euo pipefail
          PLUGINS="$RUNNER_TEMP/swift-plugins"
          mkdir -p "$PLUGINS"
          git clone --depth 1 --branch 1.39.0 \
            https://github.com/apple/swift-protobuf.git "$PLUGINS/swift-protobuf"
          git clone --depth 1 --branch 1.27.6 \
            https://github.com/grpc/grpc-swift.git "$PLUGINS/grpc-swift"
          (cd "$PLUGINS/swift-protobuf" && swift build -c release --product protoc-gen-swift)
          (cd "$PLUGINS/grpc-swift" && swift build -c release --product protoc-gen-grpc-swift)

      - name: Generate wire sources
        run: |
          set -euo pipefail
          PLUGINS="$RUNNER_TEMP/swift-plugins"
          PATH="$PLUGINS/swift-protobuf/.build/release:$PLUGINS/grpc-swift/.build/release:$PATH" \
            bash scripts/gen-swift.sh

      - name: Upload generated sources
        uses: actions/upload-artifact@v4
        with:
          name: impresario-swift-wire
          if-no-files-found: error
          path: agents/apple/Sources/ImpresarioWire/*.swift

  build:
    name: "macOS: generate + build tvOS/iOS (unsigned)"
    needs: wire
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download generated wire sources
        uses: actions/download-artifact@v4
        with:
          name: impresario-swift-wire
          path: agents/apple/Sources/ImpresarioWire

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: agents/apple
        run: xcodegen generate

      - name: Validate tvOS asset catalog
        working-directory: agents/apple
        run: |
          mkdir -p /tmp/impresario-actool
          xcrun actool Xcode/Shared/Assets.xcassets \
            --compile /tmp/impresario-actool \
            --output-format human-readable-text \
            --notices --warnings \
            --export-dependency-info /tmp/impresario-actool-deps \
            --output-partial-info-plist /tmp/impresario-actool-info.plist \
            --app-icon AppIcon \
            --launch-image LaunchImage \
            --compress-pngs \
            --enable-on-demand-resources YES \
            --development-region en \
            --leaderboard-identifier-prefix ImpresarioStub.game-center.leaderboard. \
            --leaderboard-set-identifier-prefix ImpresarioStub.game-center.leaderboard-set. \
            --target-device tv \
            --minimum-deployment-target 16.0 \
            --platform appletvos

      - name: Build tvOS stub and agent tests (unsigned)
        working-directory: agents/apple
        run: |
          set -o pipefail
          xcodebuild -project ImpresarioAgent.xcodeproj \
            -scheme ImpresarioStub-tvOS -configuration Debug \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build-tvos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= PROVISIONING_PROFILE_SPECIFIER= build
          xcodebuild -project ImpresarioAgent.xcodeproj \
            -scheme ImpresarioAgentTests-tvOS -configuration Debug \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build-tvos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= PROVISIONING_PROFILE_SPECIFIER= build-for-testing

      - name: Build iOS stub and agent tests (unsigned)
        working-directory: agents/apple
        run: |
          set -o pipefail
          xcodebuild -project ImpresarioAgent.xcodeproj \
            -scheme ImpresarioStub-iOS -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= PROVISIONING_PROFILE_SPECIFIER= build
          xcodebuild -project ImpresarioAgent.xcodeproj \
            -scheme ImpresarioAgentTests-iOS -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= PROVISIONING_PROFILE_SPECIFIER= build-for-testing

      - name: Upload unsigned products
        uses: actions/upload-artifact@v4
        with:
          name: impresario-apple-unsigned
          if-no-files-found: error
          path: |
            agents/apple/build-tvos/Build/Products/Debug-appletvos/*.app
            agents/apple/build-tvos/Build/Products/*.xctestrun
            agents/apple/build-ios/Build/Products/Debug-iphoneos/*.app
            agents/apple/build-ios/Build/Products/*.xctestrun
